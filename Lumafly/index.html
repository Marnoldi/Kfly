<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lumafly particle</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222272;
            overflow: hidden;
            position: relative;
            width: 100vw;
            height: 100vh;
            font-family: sans-serif;
        }

        #center-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #5c6bc0;
            color: #ffffff;
            padding: 25px 40px;
            border-radius: 8px;
            text-align: center;
            user-select: none;
            z-index: 10; 
        }

        .title-ko {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px; 
        }

        .title-en {
            font-size: 18px;
            opacity: 0.9;
        }

        #target-pixel {
            position: absolute;
            width: 1px;
            height: 1px;
            background-color: #222272; 
            border: none;
            padding: 0;
            cursor: default; 
            z-index: 1;
            outline: none; 
        }

        #hint-ring {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px dashed rgba(255, 255, 255, 0.4); 
            border-radius: 50%;
            pointer-events: none; 
            transform: translate(-15px, -15px); 
            display: none;
            z-index: 2;
        }

        #hint-ring.active {
            display: block;
            animation: blink 1s ease-in-out infinite; 
        }

        @keyframes blink {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

     <div id="center-box">
        <div class="title-ko">당신은 발전기에 갇힌 전기빛파리입니다,모든 에너지가 빨려 몸이 입자로 바스라지기 전 숨겨진 픽셀을 찾아 탈출하세요..🪰</div>
        <div class="title-en">You are a Charged Lumafly trapped inside a generator. Find the hidden pixels and escape before all your energy is drained and your body crumbles into some particles..🪰</div>
    </div>

    <button id="target-pixel" tabindex="-1"></button>

    <div id="hint-ring"></div>

    <script>
        const target = document.getElementById('target-pixel');
        const centerBox = document.getElementById('center-box');
        const hintRing = document.getElementById('hint-ring');
        
        let hintTimer = null; 
        let hintHideTimer = null; 

        function spawnTarget() {
            clearTimeout(hintTimer);
            clearTimeout(hintHideTimer);
            hintRing.classList.remove('active');

            const boxRect = centerBox.getBoundingClientRect();
            let randomX, randomY;
            let insideBox = true;

            const maxX = window.innerWidth - target.offsetWidth;
            const maxY = window.innerHeight - target.offsetHeight;

            while (insideBox) {
                randomX = Math.floor(Math.random() * maxX);
                randomY = Math.floor(Math.random() * maxY);

                if (
                    randomX >= boxRect.left && randomX <= boxRect.right &&
                    randomY >= boxRect.top && randomY <= boxRect.bottom
                ) {
                    insideBox = true;
                } else {
                    insideBox = false;
                }
            }

            target.style.left = randomX + 'px';
            target.style.top = randomY + 'px';

            hintRing.style.left = randomX + 'px';
            hintRing.style.top = randomY + 'px';

            hintTimer = setTimeout(showHint, 22000);
        }

        function showHint() {
            hintRing.classList.add('active'); 
            
            hintHideTimer = setTimeout(() => {
                hintRing.classList.remove('active');
            }, 2200);
        }

        window.onload = spawnTarget;

        let resizeTimeout;
        window.onresize = () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(spawnTarget, 200);
        };

        const successMessages = [
            "탈출했으나 다시 붙잡혔습니다,다시 시도하세요..🪰\nEscaped but recaptured. Try again..🪰",

        target.addEventListener('click', () => {
            clearTimeout(hintTimer);
            clearTimeout(hintHideTimer);

            try {
                const canvas = document.createElement('canvas');
                canvas.width = 1;
                canvas.height = 1;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#222272';
                ctx.fillRect(0, 0, 1, 1);

                const downloadURL = canvas.toDataURL('image/png');

                const link = document.createElement('a');
                link.href = downloadURL;
                link.download = 'ㄳ.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (error) {
                console.error("이미지 다운로드 실패:", error);
                alert("failed");
            }

            const randomIndex = Math.floor(Math.random() * successMessages.length);
            alert(successMessages[randomIndex]);
            
            spawnTarget();
        });
    </script>
</body>
</html>
