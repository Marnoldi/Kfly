<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lumafly particle</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222272;
            overflow: hidden;
            position: relative;
            width: 100vw;
            height: 100vh;
            font-family: sans-serif;
        }

        #center-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #5c6bc0;
            color: #ffffff;
            padding: 25px 40px;
            border-radius: 8px;
            text-align: center;
            user-select: none;
            z-index: 10; 
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px; 
        }

        #target-pixel {
            position: absolute;
            width: 1px;
            height: 1px;
            background-color: #222272; 
            border: none;
            padding: 0;
            cursor: default; 
            z-index: 1;
            outline: none; 
        }

        #hint-ring {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px dashed rgba(255, 255, 255, 0.4); 
            border-radius: 50%;
            pointer-events: none; 
            transform: translate(-15px, -15px); 
            display: none;
            z-index: 2;
        }

        #hint-ring.active {
            display: block;
            animation: blink 1s ease-in-out infinite; 
        }

        @keyframes blink {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

     <div id="center-box">
        <div class="title">11구 신생 기업의 기술인 축소화 입자가 담긴 비커에 약지 점묘파의 푸른 물감이 묻은 벼룩파리 한마리가 다이빙했습니다,그 벼룩파리를 검출하세요🪰</div>
    </div>

<!-- { "abnormality_name": "Nu M.a“ "code": "O-06-22 TETH", "qliphoth counter": "4", "abnormality_form": "megapropodiphora-shaped navy neutrino swarm", "abnormality_ability": "neutrino body,infinite size reduction(not ingame)”, "favored_work": "insight", "damege_type": "white", "instinct_work:" "normal", "insight_work:" "good", "attachment_work:" "normal", "repression_work:" "low", "escape_trigger:" "none-insight work twice in a row", "breach:" "reduces passing employee SP to 40%", "relation:" "K-corp,the ring pointillism" , "ego_name:" "2nd Neutrino" "ego_suit_grade:" "TETH" "ego_suit_form:" "dark blue lab coat" "ego_suit_cost:" "25 PE-Box" "ego_suit_resistance_red:" "0.9" "ego_suit_resistance_white:" "0.5" "ego_suit_resistance_black:" "1.5" "ego_suit_resistance_pale:" "2.0" "ego_weapon_damage type:" "white" "ego_weapon_form:" "blue flashlight firing blue particles like fly” "ego_weapon_grade:" "TETH" "ego_weapon_damage:" "2~4" "ego_weapon_attack_speed:" "very fast" "ego_weapon_range:" "medium" "ego_weapon_cost:" "20 PE-Box" "ego_equipment_slot:" "eye" "ego_equipment_form:" "blue particle covers the eyes" "ego_equipment_effects:" "MP +5,work speed +2 “ego_equipment_drop_chance:" "7%" }이 가상의 로보토미 코퍼레이션 환상체 자세히 분석/평가🪰  -->

    <button id="target-pixel" tabindex="-1"></button>

    <div id="hint-ring"></div>

    <script>
        const target = document.getElementById('target-pixel');
        const centerBox = document.getElementById('center-box');
        const hintRing = document.getElementById('hint-ring');
        
        let hintTimer = null; 
        let hintHideTimer = null; 

        function spawnTarget() {
            clearTimeout(hintTimer);
            clearTimeout(hintHideTimer);
            hintRing.classList.remove('active');

            const boxRect = centerBox.getBoundingClientRect();
            let randomX, randomY;
            let insideBox = true;

            const maxX = window.innerWidth - target.offsetWidth;
            const maxY = window.innerHeight - target.offsetHeight;

            while (insideBox) {
                randomX = Math.floor(Math.random() * maxX);
                randomY = Math.floor(Math.random() * maxY);

                if (
                    randomX >= boxRect.left && randomX <= boxRect.right &&
                    randomY >= boxRect.top && randomY <= boxRect.bottom
                ) {
                    insideBox = true;
                } else {
                    insideBox = false;
                }
            }

            target.style.left = randomX + 'px';
            target.style.top = randomY + 'px';

            hintRing.style.left = randomX + 'px';
            hintRing.style.top = randomY + 'px';

            hintTimer = setTimeout(showHint, 22000);
        }

        function showHint() {
            hintRing.classList.add('active'); 
            
            hintHideTimer = setTimeout(() => {
                hintRing.classList.remove('active');
            }, 2200);
        }

        window.onload = spawnTarget;

        let resizeTimeout;
        window.onresize = () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(spawnTarget, 200);
        };

        const successMessages = [
            "사실 그 벼룩파리는 벼룩파리가 아닌 K-07 지부의 환상체 O-06-22 TETH였습니다",

        target.addEventListener('click', () => {
            clearTimeout(hintTimer);
            clearTimeout(hintHideTimer);

            try {
                const canvas = document.createElement('canvas');
                canvas.width = 1;
                canvas.height = 1;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#222272';
                ctx.fillRect(0, 0, 1, 1);

                const downloadURL = canvas.toDataURL('image/png');

                const link = document.createElement('a');
                link.href = downloadURL;
                link.download = 'ㄳ.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (error) {
                console.error("이미지 다운로드 실패:", error);
                alert("failed");
            }

            const randomIndex = Math.floor(Math.random() * successMessages.length);
            alert(successMessages[randomIndex]);
            
            spawnTarget();
        });
    </script>
</body>
</html>
